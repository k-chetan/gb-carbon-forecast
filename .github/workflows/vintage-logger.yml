name: vintage-logger

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Force a failed capture (alerting drill)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: vintage-log

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out vintage-log branch
        run: |
          git fetch origin vintage-log:vintage-log
          git worktree add ../vintage vintage-log

      - name: Capture fw48h vintage
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure || 'false' }}
        run: PYTHONPATH=src python3 -m gbcarbon.vintage --out ../vintage/vintages

      - name: Commit and push
        run: |
          cd ../vintage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "capture $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push origin vintage-log; then
              exit 0
            fi
            git pull --rebase origin vintage-log
          done
          echo "push failed after 3 attempts" >&2
          exit 1
