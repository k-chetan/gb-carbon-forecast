name: nightly-forecast

on:
  schedule:
    # 03:07 UTC: yesterday's actuals are published and the previous-day
    # weather runs cover the full 48 h span. The 04:37 entry is a second
    # chance against scheduler drops; a double issue just adds a vintage.
    - cron: "7 3 * * *"
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-forecast

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Skip until a model is deployed
        id: gate
        run: |
          if [ -d models/deployed ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "no deployed model yet; skipping"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.ready == 'true'

      - run: uv sync --locked
        if: steps.gate.outputs.ready == 'true'

      - name: Issue the 48 h forecast
        if: steps.gate.outputs.ready == 'true'
        env:
          PYTHONPATH: src
        run: uv run python -m gbcarbon.forecast --out forecasts

      - name: Commit and push
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
